# Настройка была применена через "ИИ"
# На данный момент я первый раз применяю нужные настройки, для данного теста.

# 1. Включаем параллельное выполнение
junit.jupiter.execution.parallel.enabled = true

# 2. Настраиваем режим: "concurrent" означает запускать параллельно
# Потоки будут разделяться и между тестовыми классами, и между методами внутри них
junit.jupiter.execution.parallel.mode.default = concurrent
junit.jupiter.execution.parallel.mode.classes.default = concurrent

# 3. Настройка количества потоков (стратегия "dynamic")
# Фреймворк сам посмотрит, сколько ядер у вашего процессора, и создаст оптимальное число потоков
junit.jupiter.execution.parallel.config.strategy = dynamic
junit.jupiter.execution.parallel.config.dynamic.factor = 1
